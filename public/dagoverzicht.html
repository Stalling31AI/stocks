<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dag Overzicht — StockLens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1a1d23; }
.nav { background: #fff; padding: 12px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; align-items: center; gap: 8px; }
.nav-logo { font-size: 16px; font-weight: 700; margin-right: 16px; }
.nav-logo span { color: #2563eb; }
.nav-tab { font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 8px; text-decoration: none; color: #64748b; border: 1.5px solid transparent; transition: all .15s; }
.nav-tab:hover { color: #2563eb; background: #eff6ff; }
.nav-tab.actief { color: #2563eb; border-color: #2563eb; background: #eff6ff; }
.main { max-width: 1200px; margin: 0 auto; padding: 20px; }
.pagina-titel { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.pagina-subtitel { font-size: 13px; color: #64748b; margin-bottom: 24px; }
.aandeel-kaart { background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:5px solid #e2e8f0;transition:border-color .3s; }
.aandeel-kaart.koop { border-left-color:#16a34a; }
.aandeel-kaart.verkoop { border-left-color:#dc2626; }
.aandeel-kaart.wacht { border-left-color:#d97706; }
.aandeel-kaart.laden { border-left-color:#93c5fd;opacity:.7; }
.signaal-pill { display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px; }
.signaal-pill.KOOP { background:#dcfce7;color:#15803d; }
.signaal-pill.VERKOOP { background:#fee2e2;color:#dc2626; }
.signaal-pill.WACHT { background:#fef9c3;color:#854d0e; }
.signaal-pill.LADEN { background:#e0f2fe;color:#0369a1; }
.signaal-pill.FOUT { background:#f1f5f9;color:#64748b; }
table { width:100%;border-collapse:collapse;font-size:12px; }
th { text-align:left;padding:8px 10px;font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;border-bottom:2px solid #e2e8f0; }
td { padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:top; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#f8fafc; }
.dag-tab { font-size:12px;padding:5px 12px;border-radius:6px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer; }
.dag-tab.actief { background:#2563eb;color:#fff;border-color:#2563eb; }
.resultaat-select { font-size:11px;padding:3px 6px;border:1px solid #e2e8f0;border-radius:4px;cursor:pointer; }
@media (max-width:768px) {
  #samenvatting { grid-template-columns:1fr 1fr; }
  #aandelen-grid { grid-template-columns:1fr; }
  table { font-size:10px; }
  td, th { padding:6px 4px; }
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo">Stock<span>Lens</span></div>
  <a href="/" class="nav-tab">📈 Dashboard</a>
  <a href="/dagoverzicht.html" class="nav-tab actief">📋 Dag overzicht</a>
</nav>
<div class="main">
  <div class="pagina-titel">📋 Dag overzicht</div>
  <div class="pagina-subtitel" id="dag-datum"></div>
  <!-- Samenvatting balk -->
  <div id="samenvatting" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
    <div style="background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;">
      <div style="font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Koop signalen</div>
      <div style="font-size:28px;font-weight:700;color:#16a34a;" id="tel-koop">—</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;">
      <div style="font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Verkoop signalen</div>
      <div style="font-size:28px;font-weight:700;color:#dc2626;" id="tel-verkoop">—</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;">
      <div style="font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Wacht signalen</div>
      <div style="font-size:28px;font-weight:700;color:#d97706;" id="tel-wacht">—</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;">
      <div style="font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Geanalyseerd om</div>
      <div style="font-size:18px;font-weight:700;color:#2563eb;" id="analyse-tijd">—</div>
    </div>
  </div>
  <!-- Analyseer knop -->
  <button id="analyse-btn" onclick="analyseAlleAandelen()"
    style="padding:12px 24px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:20px;">
    🔍 Analyseer alle 7 aandelen
  </button>
  <!-- Voortgang -->
  <div id="voortgang-wrap" style="display:none;background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);">
    <div style="font-size:13px;font-weight:600;color:#64748b;margin-bottom:8px;" id="voortgang-titel">Bezig...</div>
    <div style="height:8px;background:#e2e8f0;border-radius:4px;margin-bottom:6px;">
      <div id="voortgang-fill" style="height:100%;background:#2563eb;border-radius:4px;width:0%;transition:width .5s;"></div>
    </div>
    <div style="font-size:11px;color:#94a3b8;" id="voortgang-status"></div>
  </div>
  <!-- Aandelen grid -->
  <div id="aandelen-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;"></div>
  <!-- Geschiedenis sectie -->
  <div id="geschiedenis-sectie" style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <div style="font-size:14px;font-weight:700;">📅 Analyse geschiedenis</div>
      <button onclick="wisGeschiedenis()"
        style="font-size:11px;color:#dc2626;background:none;border:1px solid #fecaca;border-radius:6px;padding:4px 10px;cursor:pointer;">
        🗑 Wis alles
      </button>
    </div>
    <div id="dag-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;"></div>
    <div id="geschiedenis-tabel"></div>
  </div>
</div>
<script>
const nu = new Date();
document.getElementById('dag-datum').textContent =
  nu.toLocaleDateString('nl-NL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

const WATCHLIST = [
  { symbol: 'ASML.AS',  label: 'ASML',        vlag: '🇳🇱' },
  { symbol: 'ADYEN.AS', label: 'ADYEN',        vlag: '🇳🇱' },
  { symbol: 'NVDA',     label: 'NVIDIA',       vlag: '🇺🇸' },
  { symbol: 'TSLA',     label: 'TESLA',        vlag: '🇺🇸' },
  { symbol: 'RHM.DE',   label: 'Rheinmetall',  vlag: '🇩🇪' },
  { symbol: 'BA',       label: 'Boeing',       vlag: '🇺🇸' },
  { symbol: 'LMT',      label: 'Lockheed',     vlag: '🇺🇸' },
];
let huidigeAnalyses = [];
function renderLadenKaarten() {
  document.getElementById('aandelen-grid').innerHTML = WATCHLIST.map((item,i) => `
    <div class="aandeel-kaart laden" id="kaart-${i}">
      <div style="font-size:13px;font-weight:700;color:#64748b;margin-bottom:4px;">${item.vlag} ${item.label}</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:8px;">—</div>
      <span class="signaal-pill LADEN">⏳ Laden...</span>
      <div style="font-size:11px;color:#94a3b8;margin-top:8px;">Analyse wordt opgehaald...</div>
    </div>
  `).join('');
}
function updateKaart(i, r) {
  const kaart = document.getElementById('kaart-' + i);
  if (!kaart) return;
  const fmt = v => v != null ? Number(v).toFixed(2) : '—';
  const cls = r.signaal==='KOOP'?'koop':r.signaal==='VERKOOP'?'verkoop':'wacht';
  kaart.className = 'aandeel-kaart ' + cls;
  kaart.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <div style="font-size:13px;font-weight:700;color:#64748b;">${r.vlag} ${r.label}</div>
      <div style="font-size:11px;color:#94a3b8;">${r.tijdstip||''}</div>
    </div>
    <div style="font-size:20px;font-weight:700;margin-bottom:6px;">${r.prijs ? '€'+fmt(r.prijs) : '—'}</div>
    <span class="signaal-pill ${r.signaal}">${r.actie||r.signaal}</span>
    ${r.entry ? `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0;">
      <div style="background:#f8fafc;border-radius:6px;padding:6px;">
        <div style="font-size:9px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Entry</div>
        <div style="font-size:13px;font-weight:700;color:#16a34a;">${fmt(r.entry)}</div>
      </div>
      <div style="background:#f8fafc;border-radius:6px;padding:6px;">
        <div style="font-size:9px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Stop</div>
        <div style="font-size:13px;font-weight:700;color:#dc2626;">${fmt(r.stop_loss)}</div>
      </div>
      <div style="background:#f8fafc;border-radius:6px;padding:6px;">
        <div style="font-size:9px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Target</div>
        <div style="font-size:13px;font-weight:700;color:#16a34a;">${fmt(r.target)}</div>
      </div>
    </div>` : ''}
    <div style="font-size:11px;color:#64748b;line-height:1.6;margin-bottom:6px;">${r.redenering||''}</div>
    ${r.instap_tijd ? `<div style="font-size:11px;font-weight:600;color:#2563eb;">⏰ ${r.instap_tijd}</div>` : ''}
    <a href="/?symbol=${r.symbol}"
      style="display:block;text-align:center;margin-top:10px;font-size:11px;color:#2563eb;
      text-decoration:none;padding:6px;border:1px solid #e2e8f0;border-radius:6px;">
      → Open in dashboard
    </a>
  `;
}
function updateSamenvatting() {
  document.getElementById('tel-koop').textContent = huidigeAnalyses.filter(a=>a.signaal==='KOOP').length;
  document.getElementById('tel-verkoop').textContent = huidigeAnalyses.filter(a=>a.signaal==='VERKOOP').length;
  document.getElementById('tel-wacht').textContent = huidigeAnalyses.filter(a=>a.signaal==='WACHT').length;
  document.getElementById('analyse-tijd').textContent =
    new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}
function berekenRSI(closes, period=14) {
  if (closes.length < period+1) return 50;
  let g=0, l=0;
  for (let i=closes.length-period; i<closes.length; i++) {
    const d=closes[i]-closes[i-1];
    d>0?g+=d:l-=d;
  }
  return 100-100/(1+g/(l||0.001));
}
function berekenMACD(closes) {
  const ema=(arr,p)=>{const k=2/(p+1);let e=arr[0];for(let i=1;i<arr.length;i++)e=arr[i]*k+e*(1-k);return e;};
  if (closes.length<26) return {macd:0,signal:0,histogram:0};
  const m=ema(closes.slice(-26),12)-ema(closes.slice(-26),26);
  return {macd:m,signal:0,histogram:0};
}
function berekenBollinger(closes, period=20) {
  const sl=closes.slice(-period);
  const avg=sl.reduce((a,b)=>a+b,0)/sl.length;
  const std=Math.sqrt(sl.map(x=>(x-avg)**2).reduce((a,b)=>a+b,0)/sl.length);
  return {upper:avg+2*std, middle:avg, lower:avg-2*std};
}
async function analyseAlleAandelen() {
  const btn = document.getElementById('analyse-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Bezig...';
  document.getElementById('voortgang-wrap').style.display = 'block';
  huidigeAnalyses = [];
  renderLadenKaarten();
  for (let i = 0; i < WATCHLIST.length; i++) {
    const item = WATCHLIST[i];
    const pct = Math.round((i / WATCHLIST.length) * 100);
    document.getElementById('voortgang-fill').style.width = pct + '%';
    document.getElementById('voortgang-titel').textContent =
      `Analyseren: ${item.vlag} ${item.label} (${i+1}/${WATCHLIST.length})`;
    document.getElementById('voortgang-status').textContent =
      i > 0 ? WATCHLIST.slice(0,i).map(w=>w.label).join(', ') + ' klaar' : '';
    try {
      const quoteRes = await fetch(`/api/quote/${item.symbol}?interval=15m`);
      const quoteData = await quoteRes.json();
      const quotes = quoteData.quotes || [];
      if (quotes.length < 10) throw new Error('Te weinig data');
      const closes = quotes.map(q => q.close);
      const last = quotes[quotes.length-1];
      const rsi = berekenRSI(closes);
      const macdData = berekenMACD(closes);
      const bb = berekenBollinger(closes);
      const trend = closes.slice(-5).reduce((a,b)=>a+b,0)/5 >
                    closes.slice(-10,-5).reduce((a,b)=>a+b,0)/5
                    ? 'OPWAARTS' : 'NEERWAARTS';
      const analyseRes = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          symbol: item.symbol,
          interval: '15m',
          quotes: quotes.slice(-30),
          indicators: { rsi, macd: macdData, bb, trend }
        })
      });
      const ai = await analyseRes.json();
      const resultaat = {
        symbol: item.symbol,
        label: item.label,
        vlag: item.vlag,
        prijs: last.close,
        tijdstip: new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),
        datum: new Date().toLocaleDateString('nl-NL'),
        signaal: ai.signaal || 'WACHT',
        actie: ai.actie || ai.signaal || 'WACHT',
        vertrouwen: ai.vertrouwen || 0,
        entry: ai.entry,
        stop_loss: ai.stop_loss,
        target: ai.target,
        rr_ratio: ai.rr_ratio,
        redenering: ai.redenering || '',
        instap_tijd: ai.instap_tijd || '',
        dagtrend: ai.dagtrend || '',
        nieuws_sentiment: ai.nieuws_sentiment || '',
        rsi: rsi.toFixed(1),
        macd: macdData.macd.toFixed(2),
        resultaat: 'onbekend',
      };
      huidigeAnalyses.push(resultaat);
      updateKaart(i, resultaat);
    } catch(e) {
      const fout = {
        symbol: item.symbol, label: item.label, vlag: item.vlag,
        signaal: 'FOUT', actie: 'FOUT',
        redenering: 'Fout: ' + e.message,
        tijdstip: new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),
        datum: new Date().toLocaleDateString('nl-NL'),
        resultaat: 'onbekend',
      };
      huidigeAnalyses.push(fout);
      updateKaart(i, fout);
    }
  }
  document.getElementById('voortgang-fill').style.width = '100%';
  document.getElementById('voortgang-titel').textContent = '✅ Alle analyses klaar!';
  updateSamenvatting();
  slaAnalysesOp();
  btn.disabled = false;
  btn.textContent = '🔍 Analyseer alle 7 aandelen';
}
function slaAnalysesOp() {
  const datum = new Date().toLocaleDateString('nl-NL');
  const opgeslagen = JSON.parse(localStorage.getItem('daganalyses') || '{}');
  if (!opgeslagen[datum]) opgeslagen[datum] = [];
  opgeslagen[datum].push({
    tijdstip: new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),
    analyses: huidigeAnalyses
  });
  localStorage.setItem('daganalyses', JSON.stringify(opgeslagen));
  renderDagTabs();
}
function wisGeschiedenis() {
  if (!confirm('Weet je zeker dat je alle geschiedenis wilt wissen?')) return;
  localStorage.removeItem('daganalyses');
  document.getElementById('dag-tabs').innerHTML = '';
  document.getElementById('geschiedenis-tabel').innerHTML =
    '<div style="text-align:center;color:#94a3b8;padding:30px;">Nog geen analyses opgeslagen.</div>';
}
function renderDagTabs() {
  const opgeslagen = JSON.parse(localStorage.getItem('daganalyses') || '{}');
  const dagen = Object.keys(opgeslagen).reverse();
  const tabs = document.getElementById('dag-tabs');
  if (!dagen.length) {
    tabs.innerHTML = '';
    document.getElementById('geschiedenis-tabel').innerHTML =
      '<div style="text-align:center;color:#94a3b8;padding:30px;">Nog geen analyses opgeslagen. Klik op Analyseer om te beginnen.</div>';
    return;
  }
  tabs.innerHTML = dagen.map((dag,i) => `
    <button class="dag-tab ${i===0?'actief':''}"
      onclick="selecteerDag('${dag}', this)">${dag}</button>
  `).join('');
  renderGeschiedenisTabel(dagen[0]);
}
function selecteerDag(datum, el) {
  document.querySelectorAll('.dag-tab').forEach(t=>t.classList.remove('actief'));
  el.classList.add('actief');
  renderGeschiedenisTabel(datum);
}
function renderGeschiedenisTabel(datum) {
  const opgeslagen = JSON.parse(localStorage.getItem('daganalyses') || '{}');
  const dagData = opgeslagen[datum];
  const tabel = document.getElementById('geschiedenis-tabel');
  if (!dagData || !dagData.length) {
    tabel.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">Geen analyses voor deze dag.</div>';
    return;
  }
  const alleAnalyses = dagData.flatMap(run =>
    run.analyses.map(a => ({...a, runTijd: run.tijdstip}))
  );
  tabel.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Tijd</th>
          <th>Aandeel</th>
          <th>Signaal</th>
          <th>Entry</th>
          <th>Stop-loss</th>
          <th>Target</th>
          <th>R/R</th>
          <th>Vertrouwen</th>
          <th>Resultaat</th>
        </tr>
      </thead>
      <tbody>
        ${alleAnalyses.map((a, idx) => `
          <tr>
            <td style="color:#94a3b8;white-space:nowrap;">${a.runTijd}</td>
            <td><strong>${a.vlag||''} ${a.label}</strong></td>
            <td><span class="signaal-pill ${a.signaal}" style="font-size:10px;">${a.actie||a.signaal}</span></td>
            <td style="font-weight:600;color:#16a34a;">${a.entry ? Number(a.entry).toFixed(2) : '—'}</td>
            <td style="font-weight:600;color:#dc2626;">${a.stop_loss ? Number(a.stop_loss).toFixed(2) : '—'}</td>
            <td style="font-weight:600;color:#16a34a;">${a.target ? Number(a.target).toFixed(2) : '—'}</td>
            <td>${a.rr_ratio ? Number(a.rr_ratio).toFixed(1) : '—'}</td>
            <td>${a.vertrouwen||0}%</td>
            <td>
              <select class="resultaat-select"
                onchange="slaResultaatOp('${datum}', ${idx}, this.value)">
                <option value="onbekend" ${a.resultaat==='onbekend'?'selected':''}>❓ Open</option>
                <option value="correct" ${a.resultaat==='correct'?'selected':''}>✅ Correct</option>
                <option value="incorrect" ${a.resultaat==='incorrect'?'selected':''}>❌ Incorrect</option>
              </select>
            </td>
          </tr>
          <tr style="background:#f8fafc;">
            <td colspan="9" style="font-size:11px;color:#64748b;padding:4px 10px 8px;font-style:italic;">
              ${a.redenering||''}
              ${a.instap_tijd ? ' | ⏰ '+a.instap_tijd : ''}
              ${a.nieuws_sentiment ? ' | 📰 '+a.nieuws_sentiment : ''}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
function slaResultaatOp(datum, idx, waarde) {
  const opgeslagen = JSON.parse(localStorage.getItem('daganalyses') || '{}');
  const dagData = opgeslagen[datum];
  if (!dagData) return;
  let teller = 0;
  for (const run of dagData) {
    for (const analyse of run.analyses) {
      if (teller === idx) { analyse.resultaat = waarde; break; }
      teller++;
    }
  }
  localStorage.setItem('daganalyses', JSON.stringify(opgeslagen));
  updateScore();
}
renderDagTabs();
</script>
</body>
</html>
